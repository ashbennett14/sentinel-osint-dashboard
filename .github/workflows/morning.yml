name: Morning analyst brief and podcast

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Replace today's episode after successful generation
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: sentinel-morning
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOSTED_MODE: "true"
      SCHEDULER_ENABLED: "false"
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_AUDIO_BUCKET: audio-briefs
      KOKORO_MODEL_PATH: ${{ github.workspace }}/.cache/kokoro/kokoro-v0_19.int8.onnx
      KOKORO_VOICES_PATH: ${{ github.workspace }}/.cache/kokoro/voices.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/cloud-requirements.txt }
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v019-int8
      - run: pip install -r backend/cloud-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Kokoro model assets
        run: |
          mkdir -p .cache/kokoro
          test -f "$KOKORO_MODEL_PATH" || curl -fL --retry 3 -o "$KOKORO_MODEL_PATH" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/kokoro-v0_19.int8.onnx
          test -f "$KOKORO_VOICES_PATH" || curl -fL --retry 3 -o "$KOKORO_VOICES_PATH" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/voices.bin
      - if: github.event_name == 'schedule'
        run: python scripts/cloud_job.py morning
      - if: github.event_name == 'workflow_dispatch'
        run: python scripts/cloud_job.py morning --force
