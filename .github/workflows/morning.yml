name: Morning analyst brief and podcast

on:
  schedule:
    # Run away from the top of the hour, when GitHub warns scheduled jobs are
    # most likely to be delayed or dropped. The application checks London time
    # and whether today's ready episode already exists, so these are idempotent
    # DST-safe production and recovery attempts.
    - cron: "17 4,5,6 * * *"
  workflow_run:
    workflows: ["Collect and classify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Replace today's episode after successful generation
        type: boolean
        default: false
      audio_only:
        description: Regenerate audio without rebuilding analyst briefs
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: sentinel-morning
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECTION_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$COLLECTION_RESULT" != "success" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          london_hour=$(TZ=Europe/London date +%H)
          london_date=$(TZ=Europe/London date +%F)
          if [ "$london_hour" -lt 5 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          episode_date=$(curl -fsSL --retry 3 \
            https://sentinel-osint-dashboard.vercel.app/api/audio-brief/latest \
            | jq -r '.episode_date // empty' || true)
          if [ "$episode_date" = "$london_date" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  morning:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOSTED_MODE: "true"
      SCHEDULER_ENABLED: "false"
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_AUDIO_BUCKET: audio-briefs
      SUPABASE_S3_ENDPOINT: https://snyjtckbvbarempgyhrp.storage.supabase.co/storage/v1/s3
      SUPABASE_S3_REGION: eu-west-1
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      KOKORO_MODEL_PATH: ${{ github.workspace }}/.cache/kokoro/kokoro-v0_19.int8.onnx
      KOKORO_VOICES_PATH: ${{ github.workspace }}/.cache/kokoro/voices.bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/cloud-requirements.txt }
      - uses: actions/cache@v6
        with:
          path: .cache/kokoro
          key: kokoro-v019-int8
      - run: pip install -r backend/cloud-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Kokoro model assets
        run: |
          mkdir -p .cache/kokoro
          test -f "$KOKORO_MODEL_PATH" || curl -fL --retry 3 -o "$KOKORO_MODEL_PATH" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/kokoro-v0_19.int8.onnx
          test -f "$KOKORO_VOICES_PATH" || curl -fL --retry 3 -o "$KOKORO_VOICES_PATH" https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/voices.bin
      - if: github.event_name == 'schedule'
        run: python scripts/cloud_job.py morning
      - if: github.event_name == 'workflow_run'
        run: python scripts/cloud_job.py morning
      - if: github.event_name == 'workflow_dispatch' && inputs.audio_only != true
        run: python scripts/cloud_job.py morning --force
      - if: github.event_name == 'workflow_dispatch' && inputs.audio_only == true
        run: python scripts/cloud_job.py audio --force
