name: Collect and classify

on:
  schedule:
    # Keep the half-hour cadence, away from GitHub's busiest hour boundary.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Four-AO analysis"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinel-collection
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  HOSTED_MODE: "true"
  SCHEDULER_ENABLED: "false"
  LLM_PROVIDER: gemini
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  seed:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      collect: ${{ steps.prepare.outputs.collect }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            python scripts/cloud_job.py prepare-collection --only-if-stale
          else
            python scripts/cloud_job.py prepare-collection
          fi

  collect:
    needs: seed
    if: needs.seed.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python scripts/cloud_job.py collect --shard-index ${{ matrix.shard }} --shard-count 6

  classify:
    if: always() && needs.seed.outputs.collect == 'true'
    needs: [seed, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - env:
          FETCH_RESULT: ${{ needs.collect.result }}
        run: |
          if [ "$FETCH_RESULT" = "success" ]; then
            python scripts/cloud_job.py classify
          else
            python scripts/cloud_job.py classify --partial
          fi
