name: Keep scheduled intelligence jobs active

on:
  schedule:
    # GitHub disables scheduled workflows in public repositories after 60 days
    # without repository activity. A monthly timestamp commit keeps SENTINEL's
    # unattended collection and production schedules eligible to run.
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/sentinel-keepalive
          git config user.name 'sentinel-automation'
          git config user.email 'sentinel-automation@users.noreply.github.com'
          git add .github/sentinel-keepalive
          git commit -m 'Keep scheduled intelligence jobs active'
          git push
